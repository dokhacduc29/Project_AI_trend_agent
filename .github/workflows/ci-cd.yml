# =====================================================================
# CI/CD — AI Trend Agent (ADR 0013)
# =====================================================================
# Pipeline: test -> build -> smoke -> scan -> push GHCR
#   - test:            pytest chay tren runner (image KHONG chua Tests/, xem .dockerignore)
#   - build-scan-push: build 1 LAN, smoke test container that, Trivy quet CVE,
#                      chi push GHCR khi day len nhanh main (khong push o PR).
#
# Deploy len cluster local KHONG the tu dong (runner cloud khong voi toi Docker
# Desktop cua ban) -> `kubectl apply` la thu cong, xem docs/03-engineering/ci-cd.md.
# =====================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN mac dinh chi doc; can 'packages: write' de push image len GHCR.
permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1 — TEST: chay unit + eval suite khong phu thuoc mang.
  # test_agents.py tu inject sys.path nen KHONG can PYTHONPATH hay secret.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      # Cai package o che do editable: test import bang duong dan tuyet doi
      # (ai_trend_agent.domain.models) nen package PHAI duoc cai, khong con
      # dua vao hack sys.path nhu ban cu.
      - name: Install package + dev dependencies
        run: |
          pip install -e .
          pip install -r Backend/requirements.txt

      - name: Run pytest
        run: python -m pytest Backend/tests -v

  # ------------------------------------------------------------------
  # JOB 2 — BUILD, SMOKE, SCAN, PUSH
  # Build image DUY NHAT MOT LAN (load vao docker cua runner), roi tai su dung
  # cung 1 image cho smoke + scan + push -> khong build lai, khong lech image.
  # ------------------------------------------------------------------
  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR bat buoc ten image lowercase; github.repository giu nguyen HOA
      # (dokhacduc29/Project_AI_trend_agent) -> ha chu bang bash expansion.
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # load: true -> nap image vao docker daemon cua runner de smoke/scan tai cho.
      #
      # no-cache: true -> KHONG dung layer cache. Day la build lam CONG QUET BAO MAT:
      # layer `apt-get upgrade` (va cac layer pip) bi Docker cache theo TEXT LENH, nen
      # neu tai dung se giu goi OS/python cu va Trivy quet nham trang thai CVE loi thoi
      # (vd openssl 3.5.6 vs ban va 3.5.7). Build tuoi moi lan -> Trivy luon phan anh
      # dung CVE hien tai. Job nho, tra gia ~1-2 phut la chap nhan duoc.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}
          no-cache: true

      # Smoke 1 — Import closure: moi module runtime phai import duoc trong image
      # that. Bat thieu dependency hoac lech version NGAY o day, khong cho toi runtime.
      - name: Smoke test — import closure
        run: |
          docker run --rm --entrypoint python "${IMAGE}:ci-${GITHUB_SHA}" \
            -c "import scrapers, cleaner, ai_agent, trend_agent, supabase_storage, discord_agent, gemini_client, config; print('import closure OK')"

      # Smoke 2 — Config-guard: chay CMD MAC DINH (console script ai-trend-worker)
      # voi NEWS_API_KEY rong. Worker phai thoat 78 (EXIT_CONFIG_ERROR) TRUOC khi
      # cham mang. Chung minh: image build dung, console script tu pyproject duoc
      # cai dung cho, dotenv + config-guard wiring OK.
      - name: Smoke test — config-guard exits 78
        run: |
          set +e
          docker run --rm -e NEWS_API_KEY= -e TOPIC=AI \
            "${IMAGE}:ci-${GITHUB_SHA}"
          code=$?
          echo "entrypoint exit code = ${code}"
          if [ "${code}" -ne 78 ]; then
            echo "::error::Expected exit 78 (EXIT_CONFIG_ERROR), got ${code}"
            exit 1
          fi

      # Smoke 3 — Package data: prompts/*.txt phai duoc cai KEM package (ADR 0004).
      # Neu pyproject quen khai bao package-data, prompt_loader se ImportError luc
      # runtime chu khong phai luc build -> bat ngay tai day.
      - name: Smoke test — prompt package data
        run: |
          docker run --rm --entrypoint python "${IMAGE}:ci-${GITHUB_SHA}"             -c "from ai_trend_agent.application.prompt_loader import load_prompt; [load_prompt(n) for n in ('analyzer','cleaner','trend')]; print('prompt package-data OK')"

      # Trivy — chi FAIL khi CVE co ban va (ignore-unfixed) o muc HIGH/CRITICAL.
      # Khong bi chan boi CVE base-image chua co fix; loi bao la loi ACTIONABLE.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:ci-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Chi dang nhap + push khi day len main. PR chi build/smoke/scan, KHONG push.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          docker tag "${IMAGE}:ci-${GITHUB_SHA}" "${IMAGE}:latest"
          docker tag "${IMAGE}:ci-${GITHUB_SHA}" "${IMAGE}:sha-${short_sha}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${short_sha}"
          echo "Pushed ${IMAGE}:latest and ${IMAGE}:sha-${short_sha}"
